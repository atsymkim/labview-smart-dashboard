<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabVIEW Smart Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header__title">
    <span class="header__title-main">LabVIEW Smart Dashboard</span>
  </div>

  <div class="header__status">
    <div class="conn-indicator">
      <span class="conn-indicator__dot" id="conn-dot"></span>
      <span class="conn-indicator__text" id="conn-text">연결 끊김</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<div class="status-banner" id="status-banner">시스템 대기 중</div>

<main class="main-grid">
  <section class="panel panel--chart" id="chart-area" aria-label="실시간 차트">
    <div class="panel__label">CHART</div>
    <div class="panel__chart-wrap">
      <canvas id="trendChart"></canvas>
    </div>
  </section>

  <section class="panel panel--gauge" id="gauge-area" aria-label="게이지">
    <div class="panel__label">GAUGE</div>
    <div class="gauge-grid">
      <div class="gauge-cell"><canvas id="gauge-temp-reactor"></canvas></div>
      <div class="gauge-cell"><canvas id="gauge-temp-coolant"></canvas></div>
      <div class="gauge-cell"><canvas id="gauge-press-reactor"></canvas></div>
      <div class="gauge-cell"><canvas id="gauge-stir-speed"></canvas></div>
    </div>
  </section>
</main>

<section class="led-strip" id="led-area" aria-label="상태 인디케이터">
  <div class="panel__label">STATUS</div>

  <div class="led-item">
    <span class="led-dot" id="led-coolant_flow"></span>
    <span class="led-item__label">냉각수 흐름</span>
    <div class="led-controls">
      <button type="button" class="led-btn led-btn--start" data-target="coolant_flow" data-action="start">시작</button>
      <button type="button" class="led-btn led-btn--stop" data-target="coolant_flow" data-action="stop">정지</button>
    </div>
  </div>

  <div class="led-item">
    <span class="led-dot" id="led-exhaust_valve"></span>
    <span class="led-item__label">배기 밸브</span>
    <div class="led-controls">
      <button type="button" class="led-btn led-btn--start" data-target="exhaust_valve" data-action="start">시작</button>
      <button type="button" class="led-btn led-btn--stop" data-target="exhaust_valve" data-action="stop">정지</button>
    </div>
  </div>
</section>

<section class="log-panel" id="log-area" aria-label="이벤트 로그">
  <div class="panel__label">LOG</div>
  <div class="log-list" id="log-list"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="chart.js"></script>
<script src="gauge.js"></script>
<script src="led.js"></script>
<script src="eventlog.js"></script>
<script src="control.js"></script>
</body>
</html>
